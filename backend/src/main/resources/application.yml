spring:
  application:
    name: store-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/clothing_store
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt:
      secret: "change-this-to-a-long-random-secret-key-at-least-32-bytes"
      expiration-seconds: 86400
  cors:
    allowed-origins:
      - "http://localhost:5173"
